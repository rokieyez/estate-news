# ─────────────────────────────────────────────────────────────
# 파이프라인 설정
# ─────────────────────────────────────────────────────────────

run:
  timezone: Asia/Seoul
  lookback_hours: 28        # 몇 시간 전 기사까지 볼지 (오전 실행 기준 어제 아침부터)
  max_articles: 300         # 수집 상한
  max_issues: 5             # 하루에 다룰 이슈 개수
  min_cluster_size: 1       # 이슈로 올릴 최소 보도 건수 (2로 올리면 단독 기사 제외)
  skip_recent_days: 3       # 최근 N일 안에 이미 다룬 기사는 제외 (재탕 방지)
  repeat_lookback_days: 7   # 며칠 전까지의 이슈 제목과 견줘 '같은 주제 반복' 을 알릴지

  # 한산한 날은 글을 만들지 않습니다. 큰 사건이면 반드시 여러 매체가 받아쓰므로,
  # '여러 곳이 함께 다룬 이야기' 가 없으면 조용한 날로 봅니다. 비용도 줄지만, 억지로 채운
  # 잔뉴스 글이 유사문서로 몰리는 걸 막는 쪽이 더 큰 이유입니다.
  # 통계 수집은 그대로 돌아가고, prompt-pack.md 도 남으니 마음이 바뀌면 손으로 만들 수 있습니다.
  quiet_day:
    enabled: true
    min_top_size: 3         # 가장 많이 보도된 이슈가 이 건수 미만이면 조용한 날 후보
    min_covered: 2          # 2개 매체 이상이 다룬 이슈가 이만큼 있으면 그냥 만듭니다

collect:
  timeout_seconds: 15
  max_workers: 8
  fetch_body: true          # 언론사 직접 링크는 본문까지 긁어옴 (요약 품질↑)
  fetch_body_top_n: 20      # 상위 N개 기사만 본문 수집 (속도/차단 고려)
  body_max_chars: 4000
  user_agent: "Mozilla/5.0 (compatible; rebrief/1.0; +https://github.com/rokieyez/estate-news)"
  check_links: true         # 선정된 이슈의 기사 링크가 열리는지 HEAD 요청으로 확인
  check_links_max: 60       # 점검할 링크 상한 (시간 고려)

cluster:
  # 제목 유사도(글자 2-gram Dice) 임계값. 이 값 이상이면 같은 사건으로 봅니다.
  #   0.35 (기본) — 같은 사건을 놓치지 않는 쪽. 가끔 인접 기사가 함께 묶입니다.
  #   0.45 이상   — 정밀하게. 대신 같은 사건이 두 꼭지로 갈릴 수 있습니다.
  # 실측: 같은 사건 0.35~0.69 / 다른 사건 0.00~0.40 (두 구간이 살짝 겹칩니다)
  similarity_threshold: 0.35

rank:
  # 이슈 점수 가중치
  volume: 3.0        # 여러 매체가 동시에 보도 = 핫이슈
  volume_cap: 8      # 보도 매체 수를 이 값까지만 인정 (보도자료 물량공세 방지)
  keyword: 1.0       # 키워드 사전 매칭
  recency: 1.5       # 최신성
  source: 0.8        # 매체 가중치
  breaking: 1.2      # [단독]/[속보] 가점

llm:
  enabled: true
  model: claude-opus-5      # 바꾸려면: claude-sonnet-5 (더 저렴), claude-haiku-4-5
  effort: high              # low | medium | high | xhigh | max
  max_tokens: 16000
  # 영상 대본만 한도를 크게. 출력이 가장 크고 생각 토큰까지 같은 한도를 나눠 씁니다.
  # 2026-09-08 아침 실행이 16,000 에 걸려 JSON 이 문장 중간에서 잘렸습니다.
  # 상한일 뿐이라 올려도 실제로 쓴 만큼만 돈이 나갑니다.
  script_max_tokens: 32000
  timeout_seconds: 600
  krw_per_usd: 1400         # INDEX.md 비용 표시에 쓰는 환율 (대략값)
  # 영상 대본만 다른(값싼) 모델로. 출력 토큰이 가장 많은 호출이라 하루 비용이 크게 준다.
  # 비우면 위 model 을 그대로 씁니다.
  script_model: claude-sonnet-5

  # 브리핑도 값싼 모델로. 새 글을 쓰는 게 아니라 기사를 '정리' 하는 일입니다.
  # 2026-09-07 실측에서 출력 비용의 37%가 이 호출이었습니다. 품질이 눈에 띄게 떨어지면
  # 이 줄을 비우세요 (비우면 위 model 을 그대로 씁니다).
  brief_model: claude-sonnet-5

  policy_model: claude-haiku-4-5   # 정부 보도자료 3줄 요약용 (짧은 작업이라 가장 싼 모델로)

  fallback_model: claude-sonnet-5   # 한도·장애로 실패하면 이 모델로 한 번 더 (비우면 안 함)
  monthly_budget_usd: 0     # 월 예산(달러). 0 이면 제한 없음. 80% 넘으면 fallback_model 로, 넘으면 건너뜀
  budget_soft_ratio: 0.8

images:
  enabled: true             # 수치를 인포그래픽 SVG 로 자동 생성
  max: 3                    # 하루 최대 장수 (블로그 이미지 자리 수에 맞춤)
  png: true                 # 네이버에 올리려면 PNG 가 필요합니다 (크롬이 있을 때만 변환)
  png_scale: 2              # 2배 해상도 (블로그 본문 그림·썸네일)
  # 통계 그림은 사이트에서 참고로 보는 자료라 1배(약 1000px)로 충분합니다. 2배로 두면 파일이
  # 정확히 두 배가 되고, 이 그림들은 날마다 새로 커밋됩니다 (2026-09-07 실측: 지도 208KB→104KB).
  png_scale_stats: 1
  # PNG 로 바뀐 뒤에는 SVG 를 남기지 않습니다. 같은 그림이 두 벌씩 매일 쌓이기 때문입니다.
  # 크롬이 없어 변환에 실패한 날은 SVG 가 그대로 남습니다 (그날은 그것뿐이라서).
  keep_svg: false
  cover: true               # 글 맨 위에 올릴 표지 이미지 (검색 목록 썸네일)
  thumbnails: true          # 롱폼(1280×720)·쇼츠(1080×1920) 표지 이미지
  thumbnail_variants: 2     # 썸네일 문구 후보 몇 개까지 그릴지 (1안·2안)

verify:
  numbers: true             # 브리핑 수치가 기사 제목·본문에 실제로 있는지 대조 (LLM 호출 없음)

checklist:
  autofix_model: claude-haiku-4-5   # 금지 표현이 든 문장을 이 모델로 고쳐 씀 (비우면 안 함, 몇 원 수준)

site:
  url: "https://www.rokiz.net/estate-news/"   # 알림 메시지에 붙는 사이트 주소

output:
  dir: output
  keep_raw: true            # 수집 원본 JSON 을 내 컴퓨터에 보관 (커밋은 안 됨 — 기사 본문이 들어 있어서)
  write_index: true         # output/INDEX.md 갱신

# ─────────────────────────────────────────────────────────────
# 영상 제작용 설정 — 여기를 본인 채널에 맞게 고치는 게 핵심입니다.
# ─────────────────────────────────────────────────────────────
video:
  channel_name: "부동산 브리핑"
  audience: "내 집 마련을 준비 중이거나 보유 부동산의 가치 변화를 챙기는 30~50대"
  tone: "차분하고 단정한 정보 전달. 과장·단정·투자 권유 금지. 숫자와 출처를 앞세운다."
  persona: "부동산 뉴스를 해설하는 진행자. 어려운 용어는 반드시 한 번 풀어서 설명한다."
  shorts_seconds: 60        # 쇼츠 목표 길이
  longform_minutes: 8       # 롱폼 목표 길이
  speaking_rate_cpm: 330    # 분당 발화 글자 수(한국어 기준) — 대본 길이 계산에 사용
  caption_max_chars: 16     # SRT 자막 한 줄 최대 글자 (세로 화면 기준)
  caption_max_lines: 2      # 한 컷에 보여 줄 최대 줄 수
  cut_list_fps: 30          # 컷 리스트 타임코드(HH:MM:SS:FF)의 초당 프레임

  banned_phrases:           # 대본에 쓰면 안 되는 표현
    - "무조건 오른다"
    - "지금 안 사면 늦는다"
    - "확실한 수익"
    - "추천 종목"
  cta: "도움이 되셨다면 구독과 알림 설정 부탁드립니다."

# 정부 정책 원문 — 정책브리핑(korea.kr) 보도자료에서 부동산 관련 발표를 찾아
# 3줄 요약과 원본 파일(HWP·PDF) 링크를 함께 남깁니다.
stats:
  # 정부 통계를 직접 받아옵니다. 무료 인증키가 필요하고, 없으면 이 단계는 건너뜁니다.
  #   실거래가  — 공공데이터포털에서 '아파트 매매 실거래가' 신청 → 환경변수 DATA_GO_KR_KEY
  #   부동산원  — www.reb.or.kr 열린자료 인증키 신청 → 환경변수 REB_API_KEY
  enabled: true
  max_districts: 8          # 한 번에 볼 시군구 수
  history_months: 6         # 신고가를 가릴 때 견줄 지난 달 수 (한 곳당 요청 = 1 + 이 수)
  max_highlights: 5         # 글에 실을 눈에 띄는 거래 수
  # 전세가율은 전월세 실거래가 있어야 나옵니다. 포털에서 '아파트 전월세 실거래가' 를
  # 한 번 더 활용신청하세요 (같은 인증키를 씁니다). 신청 전이면 이 항목만 조용히 빠집니다.
  jeonse: true
  # 서울 25개 구 지도. 표에 올리는 8곳 말고 스물다섯 곳을 그달 한 번씩만 더 부릅니다(+25회, 3초쯤).
  # 절반만 차면 지도로 읽히지 않아, 열여덟 곳 미만이면 그림을 그리지 않고 넘어갑니다.
  map: true
  # 시군구 코드는 법정동코드 앞 5자리입니다. 다른 지역을 보려면 이 목록만 고치세요.
  districts:
    - {name: 강남구, code: "11680"}
    - {name: 서초구, code: "11650"}
    - {name: 송파구, code: "11710"}
    - {name: 마포구, code: "11440"}
    - {name: 성동구, code: "11200"}
    - {name: 노원구, code: "11350"}
    - {name: 강서구, code: "11500"}
    - {name: 은평구, code: "11380"}
  # 부동산원 통계표 번호. reb.or.kr 의 '통계코드 검색' 에서 찾은 값입니다.
  #   T244183132827305  (주) 아파트 매매가격지수   ← 지금 쓰는 것
  #   T247713133046872  (주) 아파트 전세가격지수
  #   A_2024_00062      (월) 아파트 중위매매가격
  reb_statbl_id: "T244183132827305"          # 매매가격지수
  reb_jeonse_statbl_id: "T247713133046872"   # 전세가격지수 (비우면 매매만)
  reb_cycle: "WK"           # WK 주간 · MM 월간
  # 지역 코드(CLS_ID). 표·지도·전세가율이 전부 서울이라 지수도 서울로 맞춥니다 —
  # 전국을 쓰면 글 안에서 축이 갈립니다. 2026-09-07 에 키 없이 실제로 불러 확인한 값들:
  #   50001 전국 · 50002 수도권 · 50003 지방권 · 50008 서울 · 50016 경기 · 50025 부산 · 50033 세종
  #   50009 강북지역 · 50013 강남지역 · 50011 동북권 · 50015 동남권 (서울 권역)
  reb_region_id: "50008"
  reb_weeks: 12

  # 공급 쪽 통계 (부동산원 R-ONE, 월간). 지금까지 우리 숫자는 전부 '팔린 것' 이었습니다.
  # 미분양은 지금 안 팔리고 남은 물량, 인허가·착공은 1~2년 뒤 공급입니다.
  # 세 숫자의 성질이 서로 다릅니다 — mode 를 반드시 맞춰 적으세요.
  #   stock       그 시점의 재고 (그대로 씀)
  #   monthly     그 달 실적 (그대로 씀)
  #   cumulative  연초부터의 누계 → 프로그램이 그 달치로 되돌립니다
  # 2026-09-08 에 실제 호출해 확인한 번호·코드입니다. 발표가 두세 달 늦습니다.
  supply:
    enabled: true
    months: 13              # 표·그림에 쓸 최근 개월 수
    tables:
      - {name: 미분양, id: "T237973129847263", cls: "50018", mode: stock,
         note: "서울 전체. 다 짓고도 안 팔린 물량입니다"}
      - {name: 주택 인허가, id: "T235263129553687", cls: "50033", mode: cumulative,
         note: "서울 합계(가구수 기준). 원자료가 연초부터의 누계라 그 달치로 되돌렸습니다"}
      - {name: 아파트 착공, id: "T233033129823134", cls: "50072", mode: monthly,
         note: "서울 민간분양"}             # 몇 주(달)치를 볼지

policy:
  enabled: true
  lookback_days: 2          # 며칠 전 발표까지 볼지
  max_docs: 3               # 하루에 실을 최대 건수
  download: true            # 원본 파일을 내려받아 함께 보관 (끄면 링크만)
  max_file_mb: 5            # 이보다 큰 첨부는 건너뜁니다 (원본 파일은 매일 저장소에 쌓입니다)
  max_files_per_doc: 1      # 한 건당 받을 파일 수 (PDF 우선). 늘리면 저장소가 빨리 커집니다
  list_pages: 4             # 목록을 몇 장까지 넘겨볼지 (한 장에 20건)
  # 부처 이름 표기가 바뀌기도 하므로(기획재정부↔재정경제부) 제목에 부동산 말이 있으면 부처와 무관하게 싣습니다
  departments: [국토교통부, 기획재정부, 재정경제부, 금융위원회, 국세청, 행정안전부, 법무부]
  keywords: [부동산, 주택, 아파트, 전세, 월세, 임대, 청약, 분양, 종부세, 종합부동산세,
             재건축, 재개발, 정비사업, 공시가격, 주택공급, 대출, LTV, DSR, 전세사기]

blog:
  # 발행 플랫폼. 글의 문체와 산출 파일이 달라집니다.
  #   naver    — 네이버 블로그. blog-naver.html(붙여넣기용) 을 추가로 만듭니다.
  #   markdown — 티스토리/워드프레스/깃허브 등 범용 마크다운
  platform: naver

  max_sentence_chars: 90    # 이보다 긴 문장은 점검표에 올림
  max_paragraph_chars: 320  # 이보다 긴 문단은 점검표에 올림

  # 짧게 씁니다. 이슈 5개를 다 설명하면 3천 자가 넘고 아무도 끝까지 읽지 않습니다.
  # 메인 1개만 깊게 쓰고 나머지는 '그 밖의 오늘 소식' 에 한 줄씩 (프롬프트 규칙).
  min_chars: 1200
  max_chars: 2000
  frontmatter: true         # blog.md 에 YAML 머리말 포함 (Jekyll/Hugo/Obsidian 호환)
  category: "부동산"
  disclaimer: "본 글은 공개된 언론 보도를 정리한 것이며, 투자 판단의 책임은 이용자 본인에게 있습니다."
  highlight_repeats: 3      # 같은 수치(10%, 3억원…)가 이 횟수 이상 나오면 네이버 글에서 형광펜. 0 이면 끔
  related_posts: 3          # 글 끝에 붙일 지난 글 개수 (발행 기록에 주소가 있는 날만). 0 이면 끔
  overlap_lookback_days: 3  # 며칠 전 글까지 문장 겹침을 볼지
  max_overlap_ratio: 0.15   # 지난 글과 같은 문장이 이 비율을 넘으면 점검표에 올림
  glossary_max: 3           # 글 앞에 붙일 '낯선 말 풀이' 개수. 0 이면 끔
  key_numbers: 3            # '오늘의 숫자' 카드에 넣을 핵심 수치 개수. 본문 강조·썸네일 배지에도 쓴다. 0 이면 끔

  naver:
    fixed_tags: [부동산, 부동산뉴스, 부동산정보, 부동산브리핑, 아파트]   # 태그 30칸을 채울 고정 태그
