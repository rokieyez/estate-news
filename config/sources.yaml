# ─────────────────────────────────────────────────────────────
# 키워드 사전 — 이슈 점수와 카테고리 분류에 사용
# terms 중 하나라도 제목/요약에 들어가면 weight 만큼 점수를 더합니다.
# ─────────────────────────────────────────────────────────────
keywords:
  정책·규제:
    weight: 3.0
    terms: [국토교통부, 국토부, 부동산 대책, 규제지역, 조정대상지역, 투기과열지구,
            토지거래허가, 종부세, 종합부동산세, 취득세, 양도세, 재산세, 보유세,
            분양가상한제, 실거주 의무, 전매제한, 특례보금자리, 신생아 특례]

  대출·금리:
    weight: 2.8
    terms: [주택담보대출, 주담대, DSR, LTV, DTI, 기준금리, 금리 인상, 금리 인하,
            대출 규제, 스트레스 DSR, 정책대출, 디딤돌, 버팀목, 가계부채]

  가격동향:
    weight: 2.5
    terms: [매매가격, 전세가격, 실거래가, 아파트값, 집값, 신고가, 하락 전환,
            상승 전환, 반등, 낙폭, 주간 아파트, 부동산원, KB부동산, 매매수급]

  공급·정비사업:
    weight: 2.2
    terms: [재건축, 재개발, 리모델링, 조합, 시공사, 분양, 입주 물량, 착공, 인허가,
            3기 신도시, 공공주택, 사전청약, 미분양, 준공 후 미분양]

  청약·분양:
    weight: 2.0
    terms: [청약, 경쟁률, 특별공급, 1순위, 무순위, 줍줍, 분양권, 견본주택]

  전월세·임대:
    weight: 2.0
    terms: [전세, 월세, 반전세, 임대차, 갱신청구권, 전세사기, 역전세, 깡통전세,
            보증금, 전세보증, HUG, 임대사업자]

  지역이슈:
    weight: 1.5
    terms: [강남, 서초, 송파, 마용성, 노도강, 판교, 위례, 동탄, 세종, 부산, 대구,
            광주, 대전, 인천, 수도권, 지방 광역시, GTX]

  세금·절세:
    weight: 1.8
    terms: [양도소득세, 증여, 상속, 1가구 1주택, 비과세, 다주택자, 절세]

  시장심리:
    weight: 1.4
    terms: [거래량, 매수심리, 관망세, 패닉바잉, 영끌, 경매, 낙찰가율, 급매]

# 이 단어가 제목에 있으면 광고성/무관 기사로 보고 버립니다.
exclude_terms:
  - 부고
  - 인사
  - 포토
  - 카드뉴스
  - 오늘의 운세
  - 신간
  - 협찬
  - 이벤트 당첨

# 제목 앞의 이 태그들은 "속보성"으로 보고 가점을 줍니다.
breaking_tags: ["단독", "속보", "특징주", "1보"]
