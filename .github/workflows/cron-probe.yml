name: 예약 탐침 (임시)

# 이 저장소에서 깃허브 예약(schedule)이 도는지 **직접 재 보는** 임시 워크플로입니다.
# 지금까지 예약 실행이 한 번도 없었는데, 워크플로는 전부 active 이고 저장소도
# 공개·비포크·비보관이며 Actions 도 정상이라 눈으로는 원인을 알 수 없었습니다.
#
# 5분마다 한 줄 찍기만 합니다. 한 번이라도 돌면 '예약은 되는데 우리 cron 값이
# 문제' 이고, 30분이 지나도 안 돌면 '이 저장소는 예약 자체가 안 돈다' 입니다.
# 답이 나오면 **바로 지웁니다.**
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "예약이 돌았습니다 — $(date -u '+%F %T UTC') · 이벤트=${{ github.event_name }}"
