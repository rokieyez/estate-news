name: 부동산 월간 결산

on:
  schedule:
    # 매달 1일 09:50 KST = 같은 날 00:50 UTC. 그달이 끝난 뒤 지난달을 결산합니다.
    # 깃허브 예약은 L(말일)·W·# 을 못 쓰고 정각은 밀릴 수 있어, 1일 00:50 UTC 로 잡았습니다.
    - cron: "50 0 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "결산할 달 (YYYY-MM, 비우면 지난달)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monthly-review
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 한글 글꼴 설치 (PNG 의 한글이 깨지지 않게)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          fc-list | grep -qi "Noto Sans CJK" && echo "한글 글꼴 있음: Noto Sans CJK" || echo "::warning::한글 글꼴 설치 실패 — PNG 의 한글이 깨질 수 있습니다"

      - name: 월간 결산 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="-v monthly"
          if [ -n "${{ inputs.month }}" ]; then ARGS="$ARGS --month ${{ inputs.month }}"; fi
          python -m rebrief $ARGS

      - name: 실행 결과 요약
        if: always()
        run: |
          {
            echo "# 월간 결산"
            echo
            LATEST=$(ls -d output/monthly/*/ 2>/dev/null | sort | tail -1)
            if [ -n "$LATEST" ] && [ -f "$LATEST/monthly.md" ]; then
              cat "$LATEST/monthly.md"
            else
              echo "결산이 생성되지 않았습니다. 위 로그를 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "월간 결산: $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "푸시에 실패했습니다." >&2
          exit 1
