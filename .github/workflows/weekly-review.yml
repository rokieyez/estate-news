name: 부동산 주간 결산

on:
  schedule:
    # 매주 일요일 08:20 KST = 토요일 23:20 UTC. 데일리(06:45)가 끝난 뒤, 정각은 피해서.
    - cron: "20 23 * * 6"
  workflow_dispatch:
    inputs:
      end:
        description: "결산 마지막 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 한글 글꼴 설치 (PNG 의 한글이 깨지지 않게)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          fc-list | grep -qi "Noto Sans CJK" && echo "한글 글꼴 있음: Noto Sans CJK" || echo "::warning::한글 글꼴 설치 실패 — PNG 의 한글이 깨질 수 있습니다"

      - name: 주간 결산 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="-v weekly"
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          python -m rebrief $ARGS

      - name: 실행 결과 요약
        if: always()
        run: |
          {
            echo "# 주간 결산"
            echo
            LATEST=$(ls -d output/weekly/*/ 2>/dev/null | sort | tail -1)
            if [ -n "$LATEST" ] && [ -f "$LATEST/weekly.md" ]; then
              cat "$LATEST/weekly.md"
            else
              echo "결산이 생성되지 않았습니다. 위 로그를 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "주간 결산: $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "푸시에 실패했습니다." >&2
          exit 1
