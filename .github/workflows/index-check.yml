name: 색인 재기

# 네이버 검색이 내 글을 잡았는지 매일 재서 state/searchindex.json 에 쌓습니다.
#
# 왜 있나: 2026-09-16 에 「글이 검색에 안 나온다」를 손으로 재 보니, 부동산 블로그는
# 최근 10편 전부 누락이었지만 그 블로그는 그때 **총 10편에 첫 글이 열흘 전**이었습니다.
# 「고장」과 「아직」은 한 번 재서는 못 가릅니다 — 날마다 쌓여야 곡선이 보입니다.
# 2~4주 기다려 보기로 한 결정(2026-09-16)을 숫자로 뒷받침하는 자리입니다.
#
# 막혀도 안전합니다: 재기 전에 「블로그가 반드시 나오는 검색어」를 먼저 넣어 보고,
# 그마저 0건이면 그날은 **아무것도 적지 않습니다**. 막힌 것을 누락으로 적으면
# 장부가 거짓말을 합니다 (rebrief/searchindex.py 설명).
on:
  # ⚠ 이 저장소는 schedule 이 통째로 안 돕니다 (daily-brief.yml 설명 참고).
  # 실제로는 맥의 launchd 가 scripts/wake-daily-brief.sh 로 깨웁니다.
  # 깃허브가 예약을 되살리면 공짜 이중화가 되므로 남겨 둡니다.
  schedule:
    # 매일 08:10 KST = 전날 23:10 UTC. 아침 브리핑(06:45)이 끝난 뒤.
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (YYYY-MM-DD). 비우면 오늘"
        required: false
        type: string
      limit:
        description: "최근 몇 편을 잴지 (기본 10)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: index-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 재기
        # 입력값은 셸 문자열에 끼워 넣지 않고 환경변수로 넘긴다 (따옴표·세미콜론이 들어와도 안전).
        env:
          IN_DATE: ${{ inputs.date }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          set -- index-check
          [ -n "$IN_DATE" ] && set -- "$@" --date "$IN_DATE"
          [ -n "$IN_LIMIT" ] && set -- "$@" --limit "$IN_LIMIT"
          python -m rebrief "$@"
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --staged --quiet && exit 0
          git commit -m "색인 재기: $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
