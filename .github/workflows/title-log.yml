name: 제목 기록

# 어떤 제목을 실제로 썼고 조회수가 얼마였는지 적는 입력 폼입니다.
# Actions 탭 → 제목 기록 → Run workflow 에서 칸을 채우고 실행하면 state/titles.json 에 남습니다.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (YYYY-MM-DD)"
        required: true
        type: string
      kind:
        description: "어느 제목인지"
        required: true
        type: choice
        options: [blog, longform, shorts]
      pick:
        description: "고른 후보 번호 (1부터). 후보 밖이면 아래 title 에 직접"
        required: true
        type: string
      views:
        description: "조회수 (아직 모르면 비움)"
        required: false
        type: string
      title:
        description: "후보에 없는 제목을 썼다면 여기에"
        required: false
        type: string

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 기록
        run: |
          ARGS="titles log --date '${{ inputs.date }}' --kind '${{ inputs.kind }}' --pick '${{ inputs.pick }}'"
          [ -n "${{ inputs.views }}" ] && ARGS="$ARGS --views '${{ inputs.views }}'"
          [ -n "${{ inputs.title }}" ] && ARGS="$ARGS --title '${{ inputs.title }}'"
          eval python -m rebrief $ARGS
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state output/INDEX.md
          git diff --staged --quiet && exit 0
          git commit -m "제목 기록: ${{ inputs.date }} ${{ inputs.kind }}"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
