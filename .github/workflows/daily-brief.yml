name: 부동산 데일리 브리핑

on:
  schedule:
    # 매일 06:45 KST = 전날 21:45 UTC. 7시 전에 준비된다.
    # 정각(:00)을 피한 이유: 깃허브가 정각 예약은 밀리거나 빠뜨릴 수 있다고 문서에 밝혔고,
    # 2026-09-07 에 22:00·22:40 예약이 둘 다 돌지 않았다.
    - cron: "45 21 * * *"
    # 안전망: 07:25 KST 에 한 번 더. 06:45 실행이 성공해 오늘 산출물이 있으면 아무것도 하지 않는다.
    - cron: "25 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "산출물 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string
      no_llm:
        description: "요약·대본 생성 건너뛰기 (수집만)"
        required: false
        type: boolean
        default: false

# 결과를 저장소에 커밋해야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 오늘 산출물이 이미 있으면 건너뜀 (안전망 실행용)
        id: guard
        run: |
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "output/$DATE/data.json" ]; then
            echo "오늘($DATE) 요약이 이미 있습니다 — 안전망 실행은 여기서 끝냅니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: PNG 변환 도구 확인
        if: steps.guard.outputs.skip != 'true'
        # 그림은 SVG 로 먼저 만들고, 크롬이 있으면 PNG 로도 변환합니다.
        # 깃허브 우분투 러너에는 크롬이 기본 설치돼 있지만, 없어도 실행은 성공합니다.
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "크롬 있음: $(google-chrome --version)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "크로미엄 있음: $(chromium-browser --version)"
          else
            echo "::warning::크롬이 없어 PNG 변환을 건너뜁니다 (SVG 만 생성)"
          fi
          command -v ffmpeg >/dev/null 2>&1 && echo "ffmpeg 있음: $(ffmpeg -version | head -1)" || echo "ffmpeg 없음 — 쇼츠 초안 영상은 건너뜁니다"

      - name: 브리핑 생성
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="-v run"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python -m rebrief $ARGS

      - name: 실행 결과 요약
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          BRIEF="output/$DATE/brief.md"
          {
            echo "# $DATE 부동산 브리핑"
            echo
            if [ -f "$BRIEF" ]; then
              cat "$BRIEF"
            else
              echo "브리핑이 생성되지 않았습니다. 위 로그를 확인하세요."
            fi
            echo
            echo "---"
            echo "생성된 파일:"
            echo '```'
            ls -1 "output/$DATE" 2>/dev/null || echo "(없음)"
            echo '```'
            echo
            PNG=$(ls "output/$DATE"/img-*.png 2>/dev/null | wc -l | tr -d ' ')
            SVG=$(ls "output/$DATE"/img-*.svg 2>/dev/null | wc -l | tr -d ' ')
            THUMB=$(ls "output/$DATE"/thumb-*.png 2>/dev/null | wc -l | tr -d ' ')
            echo "그림: PNG ${PNG}장 / SVG ${SVG}장 · 썸네일 ${THUMB}장"
            if [ "$SVG" -gt 0 ] && [ "$PNG" -eq 0 ]; then
              echo "::warning::SVG 는 생성됐지만 PNG 변환이 되지 않았습니다. 크롬 설치 여부를 확인하세요."
            fi
            [ -f "output/$DATE/shorts-draft.mp4" ] && echo "쇼츠 초안 영상: 있음 (아티팩트에서 내려받기)" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          git commit -m "브리핑: $DATE"
          # 같은 시각에 다른 커밋이 들어왔을 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "푸시에 실패했습니다." >&2
          exit 1

      - name: 산출물 아티팩트 업로드
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: warn

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          python -m rebrief notify --failed --date "$DATE" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
