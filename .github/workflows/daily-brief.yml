name: 부동산 데일리 브리핑

on:
  schedule:
    # 매일 오전 7시(KST) = 전날 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "산출물 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string
      no_llm:
        description: "요약·대본 생성 건너뛰기 (수집만)"
        required: false
        type: boolean
        default: false

# 결과를 저장소에 커밋해야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="-v run"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python -m rebrief $ARGS

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          git commit -m "브리핑: $DATE"
          # 같은 시각에 다른 커밋이 들어왔을 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "푸시에 실패했습니다." >&2
          exit 1

      - name: 산출물 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
