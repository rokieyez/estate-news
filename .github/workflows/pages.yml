name: 사이트 배포

# output/ 이 바뀌면 휴대폰용 사이트를 다시 만들어 GitHub Pages 에 올립니다.
# Pages 가 **이미 켜져 있어야** 합니다. enablement: true 를 줘도 워크플로의 토큰에는
# Pages 사이트를 새로 만들 권한이 없어, 아예 없으면 이 워크플로가 죽습니다.
on:
  # 데일리 브리핑이 끝나면 이어서 배포한다.
  #
  # 브리핑 워크플로가 output/ 을 커밋하지만, 그 push 로는 이 워크플로가 켜지지
  # 않는다. GITHUB_TOKEN 으로 만든 커밋은 다른 워크플로를 다시 트리거하지
  # 않도록 깃허브가 막아 두었기 때문이다(무한 재귀 방지). workflow_run 은
  # 그 제한을 받지 않으므로 이걸로 이어 붙인다.
  workflow_run:
    workflows: ["부동산 데일리 브리핑", "부동산 주간 결산", "부동산 월간 결산", "붙여넣기 반영"]
    types: [completed]

  # 코드나 설정을 사람이 직접 고쳐서 푸시했을 때
  push:
    # 기본 브랜치에서만 배포합니다. 브랜치 이름을 바꾸면 여기도 고쳐야 합니다.
    branches:
      - main
    paths:
      - "output/**"
      - "rebrief/**"
      - "config/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 브리핑이 실패한 뒤에는 굳이 다시 배포하지 않는다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 사이트 만들기
        run: python -m rebrief site

      - uses: actions/configure-pages@v6
        with:
          # 이미 켜져 있는 Pages 를 쓴다. Pages 가 아예 없으면 여기서 만들려고 하지만,
          # 워크플로가 쓰는 토큰에는 만들 권한이 없어
          # "Create Pages site failed. Resource not accessible by integration" 으로 죽는다.
          # 그때는 사람이 저장소 설정에서 Pages 를 켜 줘야 한다 (저장소를 잠깐 비공개로
          # 돌리면 Pages 배포가 지워지므로 2026-09-10 에 실제로 이 일을 겪었다).
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # v4 부터는 점(.)으로 시작하는 파일을 빼고 올린다. site/ 는 만들어 낸
          # 결과물이라 그 안의 것은 전부 사이트의 일부다(.nojekyll 등) — 그대로 올린다.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: 주소 안내
        run: |
          {
            echo "## 사이트가 올라갔습니다"
            echo
            echo "매일 아침 아래 주소만 열면 됩니다. 휴대폰에 즐겨찾기 해두세요."
            echo
            echo "**${{ steps.deployment.outputs.page_url }}**"
          } >> "$GITHUB_STEP_SUMMARY"
