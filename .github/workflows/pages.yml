name: 사이트 배포

# output/ 이 바뀌면 휴대폰용 사이트를 다시 만들어 GitHub Pages 에 올립니다.
# Pages 가 꺼져 있으면 configure-pages 가 알아서 켭니다 (enablement: true).
on:
  # 데일리 브리핑이 끝나면 이어서 배포한다.
  #
  # 브리핑 워크플로가 output/ 을 커밋하지만, 그 push 로는 이 워크플로가 켜지지
  # 않는다. GITHUB_TOKEN 으로 만든 커밋은 다른 워크플로를 다시 트리거하지
  # 않도록 깃허브가 막아 두었기 때문이다(무한 재귀 방지). workflow_run 은
  # 그 제한을 받지 않으므로 이걸로 이어 붙인다.
  workflow_run:
    workflows: ["부동산 데일리 브리핑", "부동산 주간 결산", "부동산 월간 결산"]
    types: [completed]

  # 코드나 설정을 사람이 직접 고쳐서 푸시했을 때
  push:
    # 기본 브랜치에서만 배포합니다. 브랜치 이름을 바꾸면 여기도 고쳐야 합니다.
    branches:
      - main
    paths:
      - "output/**"
      - "rebrief/**"
      - "config/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 브리핑이 실패한 뒤에는 굳이 다시 배포하지 않는다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 사이트 만들기
        run: python -m rebrief site

      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages 가 아직 설정돼 있지 않으면 여기서 켠다.
          # 이게 없으면 "Get Pages site failed ... Not Found" 로 실패한다.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 주소 안내
        run: |
          {
            echo "## 사이트가 올라갔습니다"
            echo
            echo "매일 아침 아래 주소만 열면 됩니다. 휴대폰에 즐겨찾기 해두세요."
            echo
            echo "**${{ steps.deployment.outputs.page_url }}**"
          } >> "$GITHUB_STEP_SUMMARY"
